<template>
    <lightning-card title="Apply for Leave">
        <lightning-record-edit-form object-api-name="Leave__c" onsuccess={handleSuccess}>
            <lightning-messages></lightning-messages>
            
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input-field field-name="Employees__c"></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input-field field-name="Manager__c"></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input-field field-name="Start_Date__c"></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input-field field-name="End_Date__c"></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input-field field-name="Leave_Type__c"></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-1">
                    <lightning-input-field field-name="Reason__c"></lightning-input-field>
                </div>
            </div>

            <div class="slds-m-top_medium">
                <lightning-button type="submit" label="Submit" variant="brand"></lightning-button>
                <lightning-button label="Cancel" variant="neutral" onclick={handleCancel}></lightning-button>
            </div>
        </lightning-record-edit-form>
    </lightning-card>
</template>
