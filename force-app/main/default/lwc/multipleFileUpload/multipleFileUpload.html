<template>
    <lightning-card title="Upload Files (Max 200KB each)">
        <div class="slds-p-around_medium">
            <lightning-input type="file" 
                             label="Select Files" 
                             multiple 
                             onchange={handleFileChange}>
            </lightning-input>

            <lightning-button label="Upload" 
                              variant="brand" 
                              class="slds-m-top_medium"
                              onclick={uploadFiles}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
