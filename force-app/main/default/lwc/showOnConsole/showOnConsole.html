<template>
    <lightning-input label="First Name" type="text" name="firstName" value={firstName} onchange={handleChange}></lightning-input>
    <lightning-input label="Last Name" type="text" name="lastName" value={lastName} onchange={handleChange}></lightning-input>
    <lightning-input label="Email" type="email" name="email" value={email} onchange={handleChange}></lightning-input>
    <lightning-input label="Phone" type="text" name="phone" value={phone} onchange={handleChange}></lightning-input>
    <lightning-input label="Title" type="text" name="title" value={title} onchange={handleChange}></lightning-input>
    <lightning-button label="Save" onclick={handleClick}></lightning-button>
</template>
